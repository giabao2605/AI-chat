name: SH-01 baseline

on:
  push:
    branches: ["feature/sh-01-session-lifecycle"]
    paths: [".github/workflows/sh-01-baseline.yml"]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record environment and tracked source (no runtime data)
        run: |
          mkdir -p /tmp/sh-01-baseline
          { git rev-parse HEAD; node --version; npm --version; uname -a; cat /etc/os-release; } > /tmp/sh-01-baseline/environment.txt
          git archive --format=tar HEAD > /tmp/sh-01-baseline/source.tar
      - name: Existing tests
        run: npm test 2>&1 | tee /tmp/sh-01-baseline/test.log
      - name: Existing syntax checks
        if: always()
        run: npm run check 2>&1 | tee /tmp/sh-01-baseline/check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sh-01-baseline
          path: /tmp/sh-01-baseline/
          retention-days: 7
